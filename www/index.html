<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7b2ff7">
    <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <title>Мемори Тредс 🎴</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- ПАНЕЛЬ УПРАВЛЕНИЯ -->
    <div class="game-wrap">
        <h1>🎴 Мемори Тредс 🎴</h1>

        <div class="controls">
            <div class="controls-row">
                <button data-size="4x4" class="size-btn active">4×4</button>
                <button data-size="4x5" class="size-btn">4×5</button>
                <button data-size="6x6" class="size-btn">6×6</button>
                <button id="timer-toggle" title="Включить/выключить таймер">⏱️</button>
                <button id="sound-toggle" title="Включить/выключить звук">🔊</button>
                <button id="theme-toggle" title="Сменить тему">🌆</button>
            </div>
            <div class="controls-row">
                <button id="rating-btn" title="Рейтинг игроков">🏆</button>
                <button id="login-btn" title="Войти или зарегистрироваться">👤</button>
                <button id="restart-btn" title="Начать заново">🔄</button>
            </div>
        </div>

        <div class="stats">
            <div>Ходы: <span id="moves">0</span></div>
            <div id="timer-box">Время: <span id="time">0</span> с</div>
        </div>

        <div class="board" id="board"></div>
    </div>

    <!-- ЭКРАН ПОБЕДЫ -->
    <div class="win-screen" id="win-screen">
        <h2>🎉 Победа! 🎉</h2>

        <!-- Плашка "Новый рекорд" — показывается только если побит рекорд -->
        <div class="new-record" id="new-record">🎊 НОВЫЙ РЕКОРД! 🎊</div>

        <!-- Гифка с котом -->
        <div class="cat-gif">
            <img id="win-gif" src="" alt="Котик целует экран">
        </div>

        <p>Ходов: <span id="final-moves">0</span> | Время: <span id="final-time">0</span> с</p>

        <!-- Блок с рекордами -->
        <div class="records" id="records">
            <div>🏆 Лучший результат:</div>
            <div class="record-line">Меньше ходов: <span id="record-moves">—</span></div>
            <div class="record-line">Быстрее всех: <span id="record-time">—</span></div>
        </div>

        <button id="play-again">🎴 Играть снова</button>
    </div>

    <!-- ОКНО ВХОДА / РЕГИСТРАЦИИ -->
    <div class="auth-screen" id="auth-screen">
        <div class="auth-box">
            <h2 id="auth-title">Вход</h2>

            <div class="auth-field">
                <label>Имя игрока</label>
                <input type="text" id="auth-username" maxlength="20" placeholder="Например, Маша">
            </div>

            <div class="auth-field">
                <label>Пароль</label>
                <input type="password" id="auth-password" placeholder="Минимум 6 символов">
            </div>

            <div class="auth-error" id="auth-error"></div>

            <button id="auth-submit">Войти</button>
            <button id="auth-switch">Нет аккаунта? Зарегистрироваться</button>
            <button id="auth-cancel">Отмена</button>
        </div>
    </div>

    <!-- ОКНО РЕЙТИНГА -->
    <div class="rating-screen" id="rating-screen">
        <div class="rating-box">
            <h2>🏆 Рейтинг</h2>

            <div class="rating-tabs">
                <button class="rating-tab active" data-size="4x4">4×4</button>
                <button class="rating-tab" data-size="4x5">4×5</button>
                <button class="rating-tab" data-size="6x6">6×6</button>
            </div>

            <div class="rating-list" id="rating-list">
                <div class="rating-loading">Загрузка...</div>
            </div>

            <button id="rating-close">Закрыть</button>
        </div>
    </div>

    <script src="js/sounds.js"></script>

    <script>
        /* ============================================================
           1. НАСТРОЙКИ
           ============================================================ */

        // Сколько всего аватарок в папке images/ (файлы 1.jpg ... 34.jpg)
        const TOTAL_AVATARS = 34;

        // Настройки Supabase
        const SUPABASE_URL = 'https://yquwdsmpewtiwrqzavok.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlxdXdkc21wZXd0aXdycXphdm9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3NDM3ODgsImV4cCI6MjEwNzMxOTc4OH0.Ds5kI3ix-ey4aUUbqSm23or25Fg4OGqHgG9yJrJQ6gw';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Сколько гифок с котами в папке images/ (файлы cat1.gif, cat2.gif...)
        const TOTAL_CAT_GIFS = 27;

        // Размеры поля: сколько карточек по горизонтали и вертикали
        const SIZES = {
            '4x4': { cols: 4, rows: 4 },
            '4x5': { cols: 4, rows: 5 },
            '6x6': { cols: 6, rows: 6 }
        };

        /* ============================================================
           2. СОСТОЯНИЕ ИГРЫ
           ============================================================ */

        let currentSize = '4x4';      // текущий размер поля
        let timerEnabled = true;      // включён ли таймер
        let soundEnabled = true;
        let board = [];               // массив карточек
        let flipped = [];             // какие карточки сейчас открыты
        let matchedCount = 0;         // сколько пар найдено
        let moves = 0;                // счётчик ходов
        let lockBoard = false;        // блокировка во время проверки
        let timerInterval = null;     // интервал таймера
        let seconds = 0;              // прошедшее время
        let gameStarted = false;      // началась ли игра
        let currentRecords = null;     // рекорды для текущего размера поля
        let bestMoves = null;          // лучший результат по ходам
        let bestTime = null;           // лучший результат по времени


        /* ============================================================
           4. СОЗДАНИЕ ИГРОВОГО ПОЛЯ
           ============================================================ */

        function shuffle(arr) {
            // Перемешивание Фишера-Йетса
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function getRandomAvatars(count) {
            // Берём случайные count уникальных номеров от 1 до TOTAL_AVATARS
            const all = [];
            for (let i = 1; i <= TOTAL_AVATARS; i++) all.push(i);
            return shuffle(all).slice(0, count);
        }

        function startGame() {
            // Сброс состояния
            flipped = [];
            matchedCount = 0;
            moves = 0;
            seconds = 0;
            lockBoard = false;
            gameStarted = false;
            document.getElementById('moves').textContent = '0';
            document.getElementById('time').textContent = '0';
            document.getElementById('win-screen').classList.remove('show');

            clearInterval(timerInterval);
            lockBoard = false;
            timerInterval = null;

            // Размер поля
            const { cols, rows } = SIZES[currentSize];
            const totalCells = cols * rows;
            const pairsCount = totalCells / 2;

            // Случайные аватарки для пар
            const avatars = getRandomAvatars(pairsCount);

            // Каждая аватарка дублируется (пара)
            let cards = [];
            avatars.forEach(num => {
                cards.push(num);
                cards.push(num);
            });

            // Перемешиваем
            cards = shuffle(cards);

            // Рисуем поле
            const boardEl = document.getElementById('board');
            boardEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            boardEl.innerHTML = '';

            board = cards.map((avatarNum, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.avatar = avatarNum;
                card.dataset.index = index;

                // Задержка появления — "волна"
                // Чем больше index, тем позже появляется
                // Задержка "волной" — только на компьютере, на телефонах отключаем
                const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
                if (!isMobile) {
                    card.style.animationDelay = (index * 0.05) + 's';
                }

                card.innerHTML = `
      <div class="card-inner" style="position:absolute;inset:0;transform-style:preserve-3d;transition:transform 0.8s;">
        <div class="card-face card-back"></div>
        <div class="card-face card-front">
          <img src="images/${avatarNum}.jpg" alt="avatar">
        </div>
      </div>
    `;

                card.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    onCardClick(card);
                }, { passive: false });
                boardEl.appendChild(card);
                return card;
            });
        }

        /* ============================================================
           5. ЛОГИКА ИГРЫ
           ============================================================ */

        function onCardClick(card) {
            if (lockBoard) return;
            if (card.classList.contains('flipped')) return;
            if (card.classList.contains('matched')) return;

            // Первый клик — запускаем таймер
            if (!gameStarted) {
                gameStarted = true;
                if (timerEnabled) startTimer();
            }

            card.classList.add('flipped');
            card.querySelector('.card-inner').style.transform = 'rotateY(180deg)';
            playFlip();
            flipped.push(card);

            if (flipped.length === 2) {
                moves++;
                document.getElementById('moves').textContent = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            const [a, b] = flipped;
            const isMatch = a.dataset.avatar === b.dataset.avatar;

            if (isMatch) {
                playMatch();
                launchConfetti();

                setTimeout(() => {
                    a.classList.add('matched');
                    b.classList.add('matched');
                    matchedCount++;
                    flipped = [];

                    if (matchedCount === board.length / 2) {
                        clearInterval(timerInterval);
                        win();
                    }
                }, 400);
            } else {
                playMiss();
                lockBoard = true;
                setTimeout(() => {
                    a.classList.remove('flipped');
                    b.classList.remove('flipped');
                    a.querySelector('.card-inner').style.transform = '';
                    b.querySelector('.card-inner').style.transform = '';
                    flipped = [];
                    lockBoard = false;
                }, 900);
            }

            // СТРАХОВКА: если через 2 секунды lockBoard всё ещё true — сбрасываем
            setTimeout(() => {
                if (lockBoard) {
                    console.log('Страховка: сбрасываем lockBoard');
                    lockBoard = false;
                    flipped = [];
                }
            }, 2000);
        }

        function win() {
            clearInterval(timerInterval);
            lockBoard = false;
            flipped = [];
            playWin();


            // Выбираем случайную гифку с котом
            const randomCat = Math.floor(Math.random() * TOTAL_CAT_GIFS) + 1;
            document.getElementById('win-gif').src = `images/cat${randomCat}.gif`;

            // Обновляем рекорды
            const isNewRecord = updateRecords(currentSize, moves, seconds);

            // Показываем финальные цифры
            document.getElementById('final-moves').textContent = moves;
            document.getElementById('final-time').textContent = seconds;

            // Показываем блок с рекордами
            showRecords(currentSize);

            // Показываем плашку "Новый рекорд", если побит
            showNewRecordBanner(isNewRecord);

            setTimeout(() => {
                document.getElementById('win-screen').classList.add('show');
            }, 500);
        }

        /* ============================================================
           6. ТАЙМЕР
           ============================================================ */

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                document.getElementById('time').textContent = seconds;
            }, 1000);
        }

        /* ============================================================
           7. КОНФЕТТИ
           ============================================================ */

        const CONFETTI_COLORS = ['#ffd93d', '#ff6b6b', '#6bcbff', '#a66bff', '#6bff9e', '#ff9e6b'];

        function launchConfetti() {
            const count = 30;
            for (let i = 0; i < count; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + 'vw';
                piece.style.top = '-20px';
                piece.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
                piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                const duration = 1.5 + Math.random() * 1.5;
                piece.style.animationDuration = duration + 's';
                piece.style.animationDelay = Math.random() * 0.3 + 's';
                document.body.appendChild(piece);
                setTimeout(() => piece.remove(), (duration + 0.5) * 1000);
            }
        }

        /* ============================================================
           8. КНОПКИ УПРАВЛЕНИЯ
           ============================================================ */

        // Выбор размера
        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSize = btn.dataset.size;
                startGame();
            });
        });

        // Регистрация Service Worker для PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(() => console.log('Service Worker зарегистрирован'))
                    .catch((err) => console.log('Service Worker не зарегистрирован:', err));
            });
        }

        // Таймер вкл/выкл
        document.getElementById('timer-toggle').addEventListener('click', (e) => {
            timerEnabled = !timerEnabled;
            e.target.textContent = '⏱️';
            e.target.style.textDecoration = timerEnabled ? 'none' : 'line-through';
            e.target.style.opacity = timerEnabled ? '1' : '0.5';
            e.target.title = timerEnabled ? 'Таймер включён (нажми, чтобы выключить)' : 'Таймер выключен (нажми, чтобы включить)';

            const timerBox = document.getElementById('timer-box');
            if (timerEnabled) {
                timerBox.style.display = '';
                if (gameStarted && matchedCount < board.length / 2) startTimer();
            } else {
                timerBox.style.display = 'none';
                clearInterval(timerInterval);
            }
        });
        // Звук вкл/выкл
        document.getElementById('sound-toggle').addEventListener('click', (e) => {
            soundEnabled = !soundEnabled;
            e.target.textContent = '🔊';
            e.target.style.textDecoration = soundEnabled ? 'none' : 'line-through';
            e.target.style.opacity = soundEnabled ? '1' : '0.5';
            e.target.title = soundEnabled ? 'Звук включён (нажми, чтобы выключить)' : 'Звук выключен (нажми, чтобы включить)';
        });
        // Смена темы
        const THEMES = ['theme-medium', 'theme-light', 'theme-dark'];
        const THEME_ICONS = {
            'theme-medium': '🌆',
            'theme-light': '☀️',
            'theme-dark': '🌙'
        };

        // Загружаем сохранённую тему из localStorage
        let currentThemeIndex = 0;
        try {
            const saved = localStorage.getItem('memory-theme');
            if (saved && THEMES.includes(saved)) {
                currentThemeIndex = THEMES.indexOf(saved);
            }
        } catch (e) { }

        // Применяем тему
        function applyTheme() {
            // Убираем все классы тем
            document.body.classList.remove('theme-light', 'theme-medium', 'theme-dark');
            // Добавляем текущую
            document.body.classList.add(THEMES[currentThemeIndex]);
            // Меняем иконку на кнопке
            const btn = document.getElementById('theme-toggle');
            btn.textContent = THEME_ICONS[THEMES[currentThemeIndex]];
            btn.title = 'Тема: ' + THEMES[currentThemeIndex].replace('theme-', '');
        }

        // Клик по кнопке — переключаем на следующую тему
        document.getElementById('theme-toggle').addEventListener('click', () => {
            currentThemeIndex = (currentThemeIndex + 1) % THEMES.length;
            applyTheme();
            try {
                localStorage.setItem('memory-theme', THEMES[currentThemeIndex]);
            } catch (e) { }
        });

        // Применяем тему при загрузке
        applyTheme();

        // Заново (в панели)
        document.getElementById('restart-btn').addEventListener('click', startGame);

        // Играть снова (на экране победы)
        document.getElementById('play-again').addEventListener('click', startGame);

        /* ============================================================
   9. РЕКОРДЫ (localStorage)
   ============================================================ */

        // Ключ для хранения рекордов (один на все размеры)
        const RECORDS_KEY = 'memory-records';

        // Прочитать все рекорды из localStorage
        function loadRecords() {
            try {
                const raw = localStorage.getItem(RECORDS_KEY);
                return raw ? JSON.parse(raw) : {};
            } catch (e) {
                return {};
            }
        }

        // Сохранить все рекорды в localStorage
        function saveRecords(records) {
            try {
                localStorage.setItem(RECORDS_KEY, JSON.stringify(records));
            } catch (e) { }
        }

        // Получить рекорды для конкретного размера поля
        function getRecordsForSize(size) {
            const all = loadRecords();
            return all[size] || { bestMoves: null, bestTime: null };
        }

        // Обновить рекорды после победы. Возвращает true, если побит хоть один рекорд.
        function updateRecords(size, moves, time) {
            const all = loadRecords();
            const current = all[size] || { bestMoves: null, bestTime: null };
            let isNewRecord = false;

            if (current.bestMoves === null || moves < current.bestMoves) {
                current.bestMoves = moves;
                isNewRecord = true;
            }

            if (timerEnabled) {
                if (current.bestTime === null || time < current.bestTime) {
                    current.bestTime = time;
                    isNewRecord = true;
                }
            }

            all[size] = current;
            saveRecords(all);

            // Если игрок залогинен — сохраняем в Supabase
            if (currentUser) {
                saveRecordToSupabase(size, current.bestMoves, current.bestTime);
            }

            return isNewRecord;
        }

        // Сохранить рекорд в Supabase
        async function saveRecordToSupabase(size, moves, time) {
            try {
                const username = currentUser.user_metadata?.username || 'Игрок';
                const userId = currentUser.id;

                // Проверяем, есть ли уже запись для этого игрока + размера
                const { data: existing, error: selectError } = await supabaseClient
                    .from('records')
                    .select('*')
                    .eq('user_id', userId)
                    .eq('board_size', size)
                    .maybeSingle();

                if (selectError) {
                    console.log('Ошибка проверки рекорда:', selectError);
                    return;
                }

                if (existing) {
                    // Запись есть — обновляем, если результат лучше
                    const updateData = {};
                    if (moves < existing.best_moves) updateData.best_moves = moves;
                    if (time !== null && (existing.best_time === null || time < existing.best_time)) {
                        updateData.best_time = time;
                    }

                    if (Object.keys(updateData).length > 0) {
                        const { error: updateError } = await supabaseClient
                            .from('records')
                            .update(updateData)
                            .eq('id', existing.id);

                        if (updateError) {
                            console.log('Ошибка обновления рекорда:', updateError);
                        } else {
                            console.log('Рекорд обновлён в Supabase');
                        }
                    }
                } else {
                    // Записи нет — создаём
                    const { error: insertError } = await supabaseClient
                        .from('records')
                        .insert({
                            user_id: userId,
                            username: username,
                            board_size: size,
                            best_moves: moves,
                            best_time: time
                        });

                    if (insertError) {
                        console.log('Ошибка создания рекорда:', insertError);
                    } else {
                        console.log('Рекорд создан в Supabase');
                    }
                }
            } catch (e) {
                console.log('Ошибка сохранения рекорда:', e);
            }
        }

        // Показать рекорды на экране победы
        function showRecords(size) {
            const rec = getRecordsForSize(size);
            document.getElementById('record-moves').textContent =
                rec.bestMoves !== null ? rec.bestMoves : '—';
            document.getElementById('record-time').textContent =
                rec.bestTime !== null ? rec.bestTime + ' с' : '—';
        }

        // Показать/скрыть плашку "Новый рекорд"
        function showNewRecordBanner(show) {
            const el = document.getElementById('new-record');
            if (show) {
                el.classList.add('show');
            } else {
                el.classList.remove('show');
            }
        }
        /* ============================================================
           9. СТАРТ
           ============================================================ */
        /* ============================================================
           10. SUPABASE — РЕГИСТРАЦИЯ И ВХОД
           ============================================================ */

        let currentUser = null;       // Текущий залогиненный пользователь
        let authMode = 'login';       // 'login' или 'register'

        // Проверяем, залогинен ли кто-то при загрузке
        async function checkAuth() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    currentUser = session.user;
                    updateLoginButton();
                }
            } catch (e) {
                console.log('Ошибка проверки авторизации:', e);
            }
        }

        // Обновить иконку кнопки входа
        function updateLoginButton() {
            const btn = document.getElementById('login-btn');
            if (currentUser) {
                const username = currentUser.user_metadata?.username || 'Игрок';
                btn.textContent = '👤';
                btn.title = `Вы вошли как ${username} (нажмите, чтобы выйти)`;
                btn.style.opacity = '1';
            } else {
                btn.textContent = '👤';
                btn.title = 'Войти или зарегистрироваться';
                btn.style.opacity = '0.6';
            }
        }

        // Открыть окно входа
        function openAuth(mode = 'login') {
            authMode = mode;
            document.getElementById('auth-title').textContent = mode === 'login' ? 'Вход' : 'Регистрация';
            document.getElementById('auth-submit').textContent = mode === 'login' ? 'Войти' : 'Зарегистрироваться';
            document.getElementById('auth-switch').textContent = mode === 'login'
                ? 'Нет аккаунта? Зарегистрироваться'
                : 'Уже есть аккаунт? Войти';
            document.getElementById('auth-error').textContent = '';
            document.getElementById('auth-username').value = '';
            document.getElementById('auth-password').value = '';
            document.getElementById('auth-screen').classList.add('show');
        }

        // Закрыть окно входа
        function closeAuth() {
            document.getElementById('auth-screen').classList.remove('show');
        }

        // Показать ошибку
        function showAuthError(msg) {
            document.getElementById('auth-error').textContent = msg;
        }

        // Регистрация
        async function registerUser(username, password) {
            try {
                const email = `${username.toLowerCase()}@memorythreads.local`;

                // 1. Создаём аккаунт
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: { username: username }
                    }
                });

                if (error) {
                    if (error.message.includes('already registered')) {
                        showAuthError('Это имя уже занято. Выбери другое.');
                    } else {
                        showAuthError('Ошибка: ' + error.message);
                    }
                    return;
                }

                // 2. СРАЗУ логинимся (чтобы получить сессию)
                const { data: loginData, error: loginError } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (loginError) {
                    showAuthError('Ошибка входа после регистрации: ' + loginError.message);
                    return;
                }

                // 3. Теперь создаём профиль (мы залогинены, RLS пропустит)
                const userId = loginData.user.id;
                const { error: profileError } = await supabaseClient.from('profiles').insert({
                    id: userId,
                    username: username
                });

                if (profileError) {
                    console.log('Ошибка создания профиля:', profileError);
                } else {
                    console.log('Профиль создан успешно');
                }

                currentUser = loginData.user;
                updateLoginButton();
                closeAuth();

            } catch (e) {
                showAuthError('Ошибка: ' + e.message);
            }
        }

        // Вход
        async function loginUser(username, password) {
            try {
                const email = `${username.toLowerCase()}@memorythreads.local`;

                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    showAuthError('Неверное имя или пароль');
                    return;
                }

                currentUser = data.user;
                updateLoginButton();
                closeAuth();
            } catch (e) {
                showAuthError('Ошибка: ' + e.message);
            }
        }

        // Выход
        async function logoutUser() {
            await supabaseClient.auth.signOut();
            currentUser = null;
            updateLoginButton();
        }

        // Обработчики кнопок
        document.getElementById('login-btn').addEventListener('click', () => {
            if (currentUser) {
                if (confirm('Выйти из аккаунта?')) {
                    logoutUser();
                }
            } else {
                openAuth('login');
            }
        });

        document.getElementById('auth-submit').addEventListener('click', () => {
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value;

            if (!username || username.length < 2) {
                showAuthError('Введи имя (минимум 2 символа)');
                return;
            }
            if (!password || password.length < 6) {
                showAuthError('Пароль должен быть минимум 6 символов');
                return;
            }

            if (authMode === 'login') {
                loginUser(username, password);
            } else {
                registerUser(username, password);
            }
        });

        document.getElementById('auth-switch').addEventListener('click', () => {
            openAuth(authMode === 'login' ? 'register' : 'login');
        });

        document.getElementById('auth-cancel').addEventListener('click', closeAuth);

        // Проверяем авторизацию при загрузке
        /* ============================================================
   11. РЕЙТИНГ
   ============================================================ */

        let ratingSize = '4x4';   // текущий размер поля в рейтинге

        // Открыть окно рейтинга
        function openRating() {
            document.getElementById('rating-screen').classList.add('show');
            loadRating(ratingSize);
        }

        // Закрыть окно рейтинга
        function closeRating() {
            document.getElementById('rating-screen').classList.remove('show');
        }

        // Загрузить рейтинг из Supabase
        async function loadRating(size) {
            const list = document.getElementById('rating-list');
            list.innerHTML = '<div class="rating-loading">Загрузка...</div>';

            try {
                const { data, error } = await supabaseClient
                    .from('records')
                    .select('username, best_moves, best_time')
                    .eq('board_size', size)
                    .order('best_moves', { ascending: true })
                    .limit(20);

                if (error) {
                    list.innerHTML = '<div class="rating-loading">Ошибка загрузки</div>';
                    console.log('Ошибка загрузки рейтинга:', error);
                    return;
                }

                if (!data || data.length === 0) {
                    list.innerHTML = '<div class="rating-loading">Пока никто не играл в этом размере</div>';
                    return;
                }

                // Находим своё имя (если залогинен)
                const myUsername = currentUser?.user_metadata?.username;

                // Строим список
                list.innerHTML = data.map((row, index) => {
                    const isMe = row.username === myUsername;
                    const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : (index + 1);

                    return `
        <div class="rating-row ${isMe ? 'me' : ''}">
          <div class="rating-place">${medal}</div>
          <div class="rating-name">${row.username}</div>
          <div class="rating-score">
            <div>Ходы: ${row.best_moves}</div>
            ${row.best_time !== null ? `<div>Время: ${row.best_time} с</div>` : ''}
          </div>
        </div>
      `;
                }).join('');

            } catch (e) {
                list.innerHTML = '<div class="rating-loading">Ошибка загрузки</div>';
                console.log('Ошибка:', e);
            }
        }

        // Обработчики
        document.getElementById('rating-btn').addEventListener('click', openRating);
        document.getElementById('rating-close').addEventListener('click', closeRating);

        // Переключение размера в рейтинге
        document.querySelectorAll('.rating-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.rating-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                ratingSize = tab.dataset.size;
                loadRating(ratingSize);
            });
        });
        /* ============================================================
   12. ЗАКРЫТИЕ ОКОН ПО ESC И КЛИКУ ВНЕ
   ============================================================ */

        // Закрытие по Esc
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                // Закрываем все открытые окна
                document.getElementById('win-screen').classList.remove('show');
                document.getElementById('auth-screen').classList.remove('show');
                document.getElementById('rating-screen').classList.remove('show');
            }
        });

        // Закрытие по клику вне окна (на тёмный фон)
        document.querySelectorAll('.win-screen, .auth-screen, .rating-screen').forEach(screen => {
            screen.addEventListener('click', (e) => {
                // Закрываем, только если клик был по самому фону, а не по окну внутри
                if (e.target === screen) {
                    screen.classList.remove('show');
                }
            });
        });
        checkAuth();
        startGame();
    </script>
</body>

</html>
