<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7b2ff7">
    <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <title>Мемори Тредс 🎴</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- ПАНЕЛЬ УПРАВЛЕНИЯ -->
    <div class="game-wrap">
        <h1>🎴 Мемори Тредс 🎴</h1>

        <div class="controls">
            <div class="controls-row">
                <button data-size="4x4" class="size-btn active">4×4</button>
                <button data-size="4x5" class="size-btn">4×5</button>
                <button data-size="6x6" class="size-btn">6×6</button>
                <button id="timer-toggle" title="Включить/выключить таймер">⏱️</button>
                <button id="sound-toggle" title="Включить/выключить звук">🔊</button>
                <button id="theme-toggle" title="Сменить тему">🌆</button>
                <button id="card-back-btn" title="Сменить рубашку">🎴</button>
            </div>
            <div class="controls-row">
                <button id="rating-btn" title="Рейтинг игроков">🏆</button>
                <button id="login-btn" title="Войти или зарегистрироваться">👤</button>
                <button id="restart-btn" title="Начать заново">🔄</button>
            </div>
        </div>

        <div class="stats">
            <div>Ходы: <span id="moves">0</span></div>
            <div id="timer-box">Время: <span id="time">0</span> с</div>
        </div>

        <div class="board" id="board"></div>
    </div>

    <!-- ЭКРАН ПОБЕДЫ -->
    <div class="win-screen" id="win-screen">
        <h2>🎉 Победа! 🎉</h2>

        <!-- Плашка "Новый рекорд" — показывается только если побит рекорд -->
        <div class="new-record" id="new-record">🎊 НОВЫЙ РЕКОРД! 🎊</div>

        <!-- Гифка с котом -->
        <div class="cat-gif">
            <img id="win-gif" alt="Котик целует экран">
        </div>

        <p>Ходов: <span id="final-moves">0</span> | Время: <span id="final-time">0</span> с</p>

        <!-- Блок с рекордами -->
        <div class="records" id="records">
            <div>🏆 Лучший результат:</div>
            <div class="record-line">Меньше ходов: <span id="record-moves">—</span></div>
            <div class="record-line">Быстрее всех: <span id="record-time">—</span></div>
        </div>

        <button id="play-again">🎴 Играть снова</button>
    </div>

    <!-- ОКНО ВХОДА / РЕГИСТРАЦИИ -->
    <div class="auth-screen" id="auth-screen">
        <div class="auth-box">
            <h2 id="auth-title">Вход</h2>

            <div class="auth-field">
                <label>Имя игрока</label>
                <input type="text" id="auth-username" maxlength="20" placeholder="Например, Маша">
            </div>

            <div class="auth-field">
                <label>Пароль</label>
                <input type="password" id="auth-password" placeholder="Минимум 6 символов">
            </div>

            <div class="auth-error" id="auth-error"></div>

            <button id="auth-submit">Войти</button>
            <button id="auth-switch">Нет аккаунта? Зарегистрироваться</button>
            <button id="auth-cancel">Отмена</button>
        </div>
    </div>

    <!-- ОКНО РЕЙТИНГА -->
    <div class="rating-screen" id="rating-screen">
        <div class="rating-box">
            <h2>🏆 Рейтинг</h2>

            <div class="rating-tabs">
                <button class="rating-tab active" data-size="4x4">4×4</button>
                <button class="rating-tab" data-size="4x5">4×5</button>
                <button class="rating-tab" data-size="6x6">6×6</button>
            </div>

            <div class="rating-list" id="rating-list">
                <div class="rating-loading">Загрузка...</div>
            </div>

            <button id="rating-close">Закрыть</button>
        </div>
    </div>

    <!-- ОКНО ПРОФИЛЯ -->
    <div class="profile-screen" id="profile-screen">
        <div class="profile-box">
            <h2>👤 Профиль</h2>

            <div class="profile-avatar" id="profile-avatar">👤</div>
            <button id="emoji-toggle" class="emoji-toggle">Выбрать эмодзи ▼</button>
            <div class="profile-emoji-picker hidden" id="emoji-picker"></div>
            <button id="emoji-save" class="emoji-save hidden">Сохранить</button>
            <div class="profile-username" id="profile-username">Игрок</div>
            <div class="profile-date" id="profile-date">С нами с ...</div>

            <div class="profile-stat">
                <div class="profile-stat-icon">🔄</div>
                <div class="profile-stat-value" id="profile-flips">0</div>
                <div class="profile-stat-label">перевёрнутых карточек</div>
            </div>

            <div class="profile-records">
                <div>🏆 Лучшие результаты:</div>
                <div class="profile-record-row">
                    <span>4×4:</span>
                    <span id="profile-4x4">—</span>
                </div>
                <div class="profile-record-row">
                    <span>4×5:</span>
                    <span id="profile-4x5">—</span>
                </div>
                <div class="profile-record-row">
                    <span>6×6:</span>
                    <span id="profile-6x6">—</span>
                </div>
            </div>

            <button id="profile-logout">🚪 Выйти</button>
            <button id="profile-close">Закрыть</button>
        </div>
    </div>

    <script src="js/sounds.js"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/records.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
